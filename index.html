<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>50/30/20 Budgeting App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
        .results { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; display: none; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>50/30/20 Budget Calculator</h2>
    <form id="budgetForm">
        <label>Username:</label>
        <input type="text" id="username" name="username" required>
        <label>Monthly Income ($):</label>
        <input type="text" id="income" name="income" pattern="[0-9,]+(\.[0-9]+)?" title="Enter numbers and commas only" required>
        <button type="submit">Calculate & Save Budget</button>
    </form>

    <div id="resultsBox" class="results">
        <h3 id="resUser"></h3>
        <p><strong>Total Income:</strong> $<span id="resIncome"></span></p>
        <p><strong>50% NEEDS:</strong> $<span id="resNeeds"></span></p>
        <p><strong>30% WANTS:</strong> $<span id="resWants"></span></p>
        <p><strong>20% SAVINGS:</strong> $<span id="resSavings"></span></p>
        <p class="success" id="resSuccess"></p>
    </div>
</div>

<script>
function formatCents(centsBigInt) {
    let str = centsBigInt.toString().padStart(3, "0");
    let whole = str.slice(0, -2);
    let frac = str.slice(-2);
    whole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return whole + "." + frac;
}

document.getElementById("budgetForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const rawIncome = document.getElementById("income").value.replace(/,/g, "").trim();

    const parts = rawIncome.split(".");
    const wholePart = parts[0] || "0";
    const fracPart = ((parts[1] || "") + "00").slice(0, 2);
    const totalCents = BigInt(wholePart) * 100n + BigInt(fracPart);

    const needsCents = (totalCents * 50n) / 100n;
    const wantsCents = (totalCents * 30n) / 100n;
    const savingsCents = (totalCents * 20n) / 100n;

    const formattedIncome = formatCents(totalCents);
    const formattedNeeds = formatCents(needsCents);
    const formattedWants = formatCents(wantsCents);
    const formattedSavings = formatCents(savingsCents);

    document.getElementById("resUser").textContent = "Results for " + username;
    document.getElementById("resIncome").textContent = formattedIncome;
    document.getElementById("resNeeds").textContent = formattedNeeds;
    document.getElementById("resWants").textContent = formattedWants;
    document.getElementById("resSavings").textContent = formattedSavings;
    document.getElementById("resSuccess").textContent = "Data saved to " + username + "_budget_data.txt";
    document.getElementById("resultsBox").style.display = "block";

    const fileData = "User: " + username + "\n" +
                     "Income: $" + formattedIncome + "\n" +
                     "NEEDS: $" + formattedNeeds + "\n" +
                     "WANTS: $" + formattedWants + "\n" +
                     "SAVINGS: $" + formattedSavings + "\n\n";

    const blob = new Blob([fileData], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = username + "_budget_data.txt";
    link.click();
});
</script>
</body>
</html>
